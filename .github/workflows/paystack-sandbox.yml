# Paystack's test mode, on demand (P9 plan §16.4; docs/architecture/P9_SANDBOX_IN_CI.md). It runs the adapter's sandbox suite
# (apps/api/test/payments/paystack-provider.test.ts, PAYSTACK_SANDBOX=run) in the cloud, so no one's machine has to.
#
# It never runs on its own: a person adds the label "paystack-sandbox" to a pull request, or starts it by hand. It uses one repository
# secret, PAYSTACK_TEST_SECRET_KEY, which must be a TEST key (sk_test_…): the job stops at once on anything else, so a live key
# can never be used here. The customer email domain, which must end in a real top-level domain, is the repository variable
# PAYSTACK_TEST_WALLET_EMAIL_DOMAIN, or the input of a manual start. The complete output is kept as an artifact.
name: Paystack sandbox (on demand)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      email_domain:
        description: 'Domain of the synthetic customer emails (a real top-level domain, never .test)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: paystack-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Paystack sandbox suite
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'paystack-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same disposable PostgreSQL as the main job: the test harness builds a throwaway database for the run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphakolect
          POSTGRES_PASSWORD: ci-only-superuser-password
          POSTGRES_DB: alphakolect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphakolect -d alphakolect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: '5432'
      POSTGRES_USER: alphakolect
      POSTGRES_PASSWORD: ci-only-superuser-password
      DB_MIGRATOR_PASSWORD: ci-only-migrator-password
      DB_APP_PASSWORD: ci-only-app-role-password
      DB_WORKER_PASSWORD: ci-only-worker-role-password
      DB_READONLY_PASSWORD: ci-only-readonly-password
      PAYSTACK_SANDBOX: run
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
      PAYSTACK_TEST_WALLET_EMAIL_DOMAIN: ${{ inputs.email_domain || vars.PAYSTACK_TEST_WALLET_EMAIL_DOMAIN }}
    steps:
      - name: Only a test key, and a domain with a real ending
        run: |
          case "$PAYSTACK_TEST_SECRET_KEY" in
            sk_test_?*) ;;
            *) echo "::error::PAYSTACK_TEST_SECRET_KEY is missing or is not a test key (sk_test_…). Nothing was run."; exit 1 ;;
          esac
          if [ -z "$PAYSTACK_TEST_WALLET_EMAIL_DOMAIN" ]; then
            echo "::error::No customer email domain: set the repository variable PAYSTACK_TEST_WALLET_EMAIL_DOMAIN or give the input."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the sandbox suite
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "customer email domain: ${PAYSTACK_TEST_WALLET_EMAIL_DOMAIN}"
            echo "started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
          } | tee sandbox-run.txt
          set +e
          pnpm --filter @alphakolect/api exec vitest run test/payments/paystack-provider.test.ts --reporter=verbose 2>&1 | tee -a sandbox-run.txt
          code=${PIPESTATUS[0]}
          echo "--- exit: ${code}" | tee -a sandbox-run.txt
          echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a sandbox-run.txt
          exit "$code"

      - name: Keep the complete output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paystack-sandbox-${{ github.sha }}-${{ github.run_id }}
          path: sandbox-run.txt
          if-no-files-found: warn
