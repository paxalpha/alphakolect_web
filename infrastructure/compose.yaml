# Local development services for the new system (TARGET_ARCHITECTURE §23: "local: compose").
# This is NOT the legacy recovery database (alphakolect-recovery-db on 5435); the new system starts clean (§25).
#
#   cp infrastructure/.env.example infrastructure/.env   # then set POSTGRES_PASSWORD
#   docker compose -f infrastructure/compose.yaml up -d
#
# Ports are bound to 127.0.0.1 only, so nothing is reachable from the network.
name: alphakolect

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alphakolect
      POSTGRES_USER: alphakolect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - postgres16-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alphakolect -d alphakolect']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # PostgreSQL 16 per TARGET_ARCHITECTURE §19. (A data directory created by another major version
  # cannot be opened, so this volume name is version-specific.)
  postgres16-data:
