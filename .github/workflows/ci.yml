# Continuous integration for the rebuild workspace (RESTRUCTURING_MAP P0 exit criteria).
# legacy/ is outside the pnpm workspace and ignored by lint/format, so it is never built or tested here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A disposable PostgreSQL 16 (TARGET_ARCHITECTURE §19) for the packages/db and apps/api tests. The test
    # harness creates the roles itself (packages/db/sql/bootstrap/roles.sql), then a throwaway, fully migrated
    # database per test run. The API tests send email to an in-memory adapter, so no mail service is needed.
    # These passwords are CI-only: the container exists for one job and is never reachable externally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alphakolect
          POSTGRES_PASSWORD: ci-only-superuser-password
          POSTGRES_DB: alphakolect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphakolect -d alphakolect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: '5432'
      POSTGRES_USER: alphakolect
      POSTGRES_PASSWORD: ci-only-superuser-password
      DB_MIGRATOR_PASSWORD: ci-only-migrator-password
      DB_APP_PASSWORD: ci-only-app-role-password
      DB_READONLY_PASSWORD: ci-only-readonly-password
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      - name: OpenAPI spec is up to date with the contracts
        run: pnpm --filter @alphakolect/contracts openapi:check

      - run: pnpm typecheck
      - run: pnpm test
      # The two-connection suites (P5 plan §9.3): their own command, part of every gate, 50 runs per race.
      - run: pnpm test:concurrency
      - run: pnpm build # includes the contracts' independent typecheck consumer

      - name: API refuses to boot without required configuration
        run: |
          if node apps/api/dist/server.js; then
            echo "::error::apps/api started without DATABASE_URL"
            exit 1
          fi

      # The API contract for this build (P2). External publishing to the mobile developer is decided
      # when the authenticated contracts are ready (OPEN-16); until then this artifact is the hand-off.
      - name: Publish OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1-${{ github.sha }}
          path: packages/contracts/openapi/v1.json
          if-no-files-found: error

  api-contract:
    name: API contract (breaking-change check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: 1.32.1
      SPEC: packages/contracts/openapi/v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit's spec is the baseline

      - name: Install oasdiff (pinned, checksum-verified)
        run: |
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          file="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" oasdiff

      # Pull requests compare with the target branch's spec; pushes compare with the previous commit.
      # Breaking changes to a published contract break mobile clients (TARGET_ARCHITECTURE §24).
      - name: Fail on breaking changes against the base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}:${SPEC}" 2>/dev/null; then
            echo "::notice::No ${SPEC} at the base commit; nothing to compare yet."
            exit 0
          fi
          git show "${BASE_SHA}:${SPEC}" > base-openapi.json
          ./oasdiff breaking base-openapi.json "${SPEC}" --fail-on ERR --format githubactions

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the tip

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks

      # Uses .gitleaks.toml (extra rules) and .gitleaksignore (reviewed fingerprints) from the repo root.
      - name: Scan git history
        run: ./gitleaks git . --redact --no-banner -v
